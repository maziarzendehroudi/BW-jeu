<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bat&Watt-v0.1 - Moteur Sonore WebAudio Documenté</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 100vw; height: 100dvh; overflow: hidden; color: #ffffff; touch-action: none; }
        #game-container { position: relative; width: 100%; height: 100%; background: linear-gradient(to bottom, #ff758c, #ff7eb3); overflow: hidden; }

        /* --- ÉTOILES & ASTRES & NUAGES --- */
        #stars-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)); background-repeat: repeat; background-size: 200px 200px; opacity: 0; transition: opacity 2s ease-in-out; z-index: 0; }
        .cloud { position: absolute; background: rgba(255, 255, 255, 0.8); border-radius: 50px; z-index: 2; animation: floatCloud linear infinite; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.1); }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: inherit; box-shadow: inherit; }
        .cloud::before { bottom: 40%; left: 15%; width: 50%; height: 100%; } .cloud::after { bottom: 20%; right: 10%; width: 40%; height: 80%; }
        @keyframes floatCloud { from { transform: translateX(110vw); } to { transform: translateX(-30vw); } }
        .celestial { position: absolute; width: 52px; height: 52px; z-index: 1; will-change: transform, opacity; }
        .sun { border-radius: 50%; background: #fde047; box-shadow: 0 0 60px #facc15; }
        .moon { background: transparent; box-shadow: none; overflow: visible; }

        /* --- DÉCOR : PAYSAGE ÉLÉGANT --- */
        .mountain-back { position: absolute; bottom: 15%; left: 0; width: 100%; height: 35%; background: linear-gradient(to bottom, #64748b, #1e293b); clip-path: polygon(0% 100%, 15% 30%, 30% 60%, 50% 10%, 70% 50%, 85% 20%, 100% 100%); z-index: 3; }
        .hill-mid-left { position: absolute; bottom: -5%; left: -10%; width: 65%; height: 30%; background: linear-gradient(to bottom, #0f766e, #042f2e); border-radius: 50%; z-index: 4; }
        .hill-mid-right { position: absolute; bottom: -8%; right: -10%; width: 75%; height: 35%; background: linear-gradient(to bottom, #0d9488, #022c22); border-radius: 50%; z-index: 5; }
        .hill-foreground { position: absolute; bottom: -15%; left: -10%; width: 120%; height: 30%; background: linear-gradient(to bottom, #064e3b, #020617); border-radius: 50% 50% 0 0; z-index: 6; }
        .mist-layer { position: absolute; bottom: 10%; left: -10%; width: 120%; height: 100px; background: linear-gradient(to top, rgba(45, 212, 191, 0.2), transparent); filter: blur(12px); z-index: 7; pointer-events: none; animation: mistBreathe 8s infinite alternate ease-in-out; }
        @keyframes mistBreathe { 0% { transform: translateY(0) scaleY(1); opacity: 0.4; } 100% { transform: translateY(-10px) scaleY(1.3); opacity: 0.8; } }

        /* --- HUD --- */
        .top-hud { position: absolute; top: 0; left: 0; width: 100%; padding: 30px 20px 0; z-index: 40; pointer-events: none; display: flex; align-items: center; justify-content: space-between; gap: 0; }
        .hud-side { flex-grow: 1; position: relative; height: 12px; display: flex; align-items: center; transition: transform 0.5s ease; }
        #battery-container { margin-right: -15px; } #bio-container { margin-left: -15px; }
        
        .modern-track { width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 1px 1px rgba(255,255,255,0.15); pointer-events: auto; transition: transform 0.2s, box-shadow 0.5s ease, background 0.5s ease; }
        #battery-container .modern-track { border-radius: 6px 0 0 6px; display: flex; justify-content: flex-end; }
        #bio-container .modern-track { border-radius: 0 6px 6px 0; }
        .modern-fill { height: 100%; border-radius: inherit; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s; }
        .power-fill { background: linear-gradient(to right, #fef08a, #ef4444); box-shadow: 0 0 15px rgba(254, 240, 138, 0.8), 0 0 5px rgba(254, 240, 138, 0.5); }
        .bio-fill { background: linear-gradient(to right, #ef4444, #10b981); box-shadow: 0 0 15px rgba(16, 185, 129, 0.8), 0 0 5px rgba(16, 185, 129, 0.5); }
        .hud-stats { position: absolute; top: 24px; display: flex; align-items: center; gap: 6px; font-size: 24px; font-weight: 900; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); transition: all 0.3s ease; }
        #battery-container .hud-stats { left: 0; } #bio-container .hud-stats { right: 0; }
        
        /* --- ANIMATIONS URGENCE JAUGE --- */
        .danger-50 { animation: pulseAlert50 1.5s infinite ease-in-out; }
        .danger-25 { animation: pulseAlert25 0.75s infinite ease-in-out; }
        @keyframes pulseAlert50 { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
        @keyframes pulseAlert25 { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .danger-50 .modern-track { background: rgba(153, 27, 27, 0.7); box-shadow: inset 0 2px 4px rgba(0,0,0,0.9), 0 0 12px rgba(239, 68, 68, 0.5); }
        .danger-25 .modern-track { background: rgba(220, 38, 38, 0.8); box-shadow: inset 0 2px 4px rgba(0,0,0,0.9), 0 0 20px rgba(239, 68, 68, 0.9); }

        .hud-icon { font-size: 18px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); display: flex; align-items: center; } 
        .unit { font-size: 14px; font-weight: 700; color: #cbd5e1; }
        .hud-center { display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #2563eb, #3b82f6); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5), inset 0 2px 4px rgba(255,255,255,0.3); color: white; padding: 14px 40px; border-radius: 20px; pointer-events: auto; position: relative; z-index: 50; flex-shrink: 0; }
        .day-text { font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; margin-bottom: -4px; }
        .day-num { font-size: 54px; font-weight: 900; line-height: 1; }
        
        .level-up-anim { animation: dayUpSpectacular 2s forwards; }
        @keyframes dayUpSpectacular { 0% { transform: scale(1) rotate(0deg); filter: brightness(1); } 20% { transform: scale(1.3) translateY(2px) rotate(-5deg); filter: brightness(1.5); } 50% { transform: scale(1.8) translateY(12px) rotate(5deg); filter: brightness(2.5) drop-shadow(0 0 40px #f59e0b); color: #ffffff; text-shadow: 0 0 20px #fbbf24, 0 0 40px #ea580c; } 80% { transform: scale(1.3) translateY(2px) rotate(-3deg); filter: brightness(1.5); } 100% { transform: scale(1) rotate(0deg); filter: brightness(1); } }

        /* --- ÉOLIENNES --- */
        .wind-turbine { position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; transition: filter 0.2s; pointer-events: none; }
        #turbine-1 { left: 28%; bottom: 10%; } #turbine-2 { left: 68%; bottom: 12%; }
        .tower { position: relative; background: linear-gradient(to right, #64748b 0%, #ffffff 40%, #e2e8f0 60%, #475569 100%); border-radius: 2px; }
        #turbine-1 .tower { height: 135px; width: 14px; clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); } #turbine-2 .tower { height: 165px; width: 16px; clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); }
        .nacelle-group { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 11; }
        .nacelle { position: absolute; top: -8px; left: -12px; width: 38px; height: 16px; background: linear-gradient(to bottom, #ffffff, #94a3b8); border-radius: 8px 16px 16px 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .curtailed .nacelle { background: linear-gradient(to bottom, #fdba74, #ea580c); }
        .hub { position: absolute; top: -2px; left: -8px; width: 20px; height: 20px; background: linear-gradient(135deg, #f8fafc, #64748b); border-radius: 50%; box-shadow: -2px 0 4px rgba(0,0,0,0.2); z-index: 12; }
        .blades-container { position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: 13; }
        .blade { position: absolute; bottom: 0; left: -4px; width: 8px; background: linear-gradient(to bottom, #cbd5e1, #ffffff); border-radius: 4px; transform-origin: bottom center; clip-path: polygon(15% 0%, 85% 0%, 100% 90%, 50% 100%, 0% 90%); }
        #turbine-1 .blade { height: 75px; } #turbine-2 .blade { height: 90px; width: 9px; left: -4.5px; }
        .blade:nth-child(1) { transform: rotate(0deg); } .blade:nth-child(2) { transform: rotate(120deg); } .blade:nth-child(3) { transform: rotate(240deg); }
        .turbine-hitbox { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 240px; z-index: 20; cursor: pointer; pointer-events: auto; }

        /* --- ANIMAUX CSS --- */
        .creature { position: absolute; z-index: 30; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); will-change: transform; pointer-events: none; transform: scale(0.65); transform-origin: center center; }
        .bird .body { width: 14px; height: 26px; border-radius: 50% 50% 40% 40%; position: absolute; left: -7px; top: -13px; z-index: 2; }
        .bird .body::after { content:''; position:absolute; bottom:-6px; left:4px; width:6px; height:8px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
        .bird .wing { width: 28px; height: 16px; position: absolute; top: -8px; }
        .bird .wing.left { left: -30px; transform-origin: right center; border-radius: 20px 0 0 20px; animation: flapBirdL 0.35s infinite alternate ease-in-out; }
        .bird .wing.right { right: -30px; transform-origin: left center; border-radius: 0 20px 20px 0; animation: flapBirdR 0.35s infinite alternate ease-in-out; }
        @keyframes flapBirdL { 0% { transform: rotate(15deg); } 100% { transform: rotate(-50deg); } }
        @keyframes flapBirdR { 0% { transform: rotate(-15deg); } 100% { transform: rotate(50deg); } }

        .sp-eagle .body { background: #8b5a2b; } .sp-eagle .body::after { background: #facc15; } .sp-eagle .wing { background: #654321; }
        .sp-pigeon .body { background: #94a3b8; } .sp-pigeon .body::after { background: #cbd5e1; } .sp-pigeon .wing { background: #64748b; }
        .sp-crow .body { background: #1e293b; } .sp-crow .body::after { background: #0f172a; } .sp-crow .wing { background: #020617; }
        .sp-parrot .body { background: #855c41; } .sp-parrot .body::after { background: #ea580c; } .sp-parrot .wing { background: #5c3a21; }

        .bat .body { width: 12px; height: 22px; background: #1e293b; border-radius: 40% 40% 60% 60%; position: absolute; left: -6px; top: -11px; z-index: 2; }
        .bat .body::before { content:''; position:absolute; top:-4px; left:2px; width:8px; height:6px; background: #1e293b; clip-path: polygon(0 100%, 50% 0, 100% 100%); }
        .bat .wing { width: 24px; height: 18px; background: #334155; position: absolute; top: -6px; }
        .bat .wing.left { left: -26px; transform-origin: right top; border-radius: 20px 0 20px 20px; animation: flapBatL 0.2s infinite alternate ease-in-out; }
        .bat .wing.right { right: -26px; transform-origin: left top; border-radius: 0 20px 20px 20px; animation: flapBatR 0.2s infinite alternate ease-in-out; }
        @keyframes flapBatL { 0% { transform: rotate(30deg) scaleX(1); } 100% { transform: rotate(-50deg) scaleX(0.5); } }
        @keyframes flapBatR { 0% { transform: rotate(-30deg) scaleX(1); } 100% { transform: rotate(50deg) scaleX(0.5); } }

        .crashing { animation: crashFall 0.8s ease-in forwards; }
        @keyframes crashFall { 0% { transform: rotate(0deg) scale(0.65); } 50% { transform: rotate(180deg) scale(0.85); } 100% { transform: rotate(540deg) scale(0.4); opacity: 0; } }
        .feedback-text { position: absolute; font-weight: bold; font-size: 16px; z-index: 60; animation: floatUp 1s ease-out forwards; pointer-events: none; }
        .feedback-good { color: #10b981; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .feedback-bad { color: #ef4444; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

        /* --- MODALES & MENUS & BOUTON PAUSE --- */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; pointer-events: auto; }
        .menu-box { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-width: 400px; width: 90%; }
        .menu-box h1 { font-size: 28px; margin-bottom: 15px; background: linear-gradient(to right, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-main { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 6px 0 #047857; transition: all 0.1s; width: 100%; margin-bottom: 10px; }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px;}
        .hidden { display: none !important; pointer-events: none; }
        .input-name { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.4); color: white; text-align: center; font-weight: bold; outline: none; }
        .leaderboard-table { width: 100%; margin-bottom: 20px; border-collapse: collapse; font-size: 14px; }
        .leaderboard-table th { color: #60a5fa; border-bottom: 1px solid rgba(255,255,255,0.2); padding: 8px; text-align: center; }
        .leaderboard-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }

        /* Bouton Pause Minimaliste tout en bas au milieu */
        #btn-pause { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 44px; height: 44px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 50; pointer-events: auto; backdrop-filter: blur(4px); transition: background 0.2s; }
        #btn-pause:active { background: rgba(0, 0, 0, 0.7); }
        .pause-bars { width: 14px; height: 14px; display: flex; justify-content: space-between; }
        .pause-bar { width: 4px; height: 100%; background: white; border-radius: 2px; }

        /* Style pour score négatif */
        .text-danger { color: #ef4444 !important; text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="stars-container"></div>
        <div class="cloud" style="top: 15%; width: 60px; height: 20px; animation-duration: 40s;"></div>
        <div class="cloud" style="top: 30%; width: 100px; height: 30px; animation-duration: 25s; opacity: 0.6;"></div>
        
        <div id="sun-body" class="celestial sun"></div>
        <div id="moon-body" class="celestial moon">
            <svg viewBox="0 0 52 52" width="100%" height="100%"><path d="M26,0 A26,26 0 0,1 26,52 A14,26 0 0,0 26,0 Z" fill="#f1f5f9" /></svg>
        </div>

        <div class="mountain-back"></div>
        <div class="hill-mid-left"></div>
        <div class="hill-mid-right"></div>
        <div class="hill-foreground"></div>
        <div class="mist-layer"></div>

        <div class="top-hud">
            <div class="hud-side" id="battery-container">
                <div class="modern-track"><div class="modern-fill power-fill" id="battery-fill" style="width: 100%;"></div></div>
                <div class="hud-stats"><span class="hud-icon">⚡</span><span class="hud-value"><span id="energy-count">10</span><span class="unit" id="energy-max">/10</span></span></div>
            </div>
            <div class="hud-center" id="level-badge"><div class="day-text">Jour</div><div class="day-num" id="level-num">1</div></div>
            <div class="hud-side" id="bio-container">
                <div class="modern-track"><div class="modern-fill bio-fill" id="bio-fill" style="width: 100%;"></div></div>
                <div class="hud-stats">
                    <span class="hud-icon" id="bio-icon">
                        <svg id="bio-heart-svg" width="20" height="20" viewBox="0 0 24 24" fill="#10b981" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); transition: fill 0.3s;">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </span>
                    <span class="hud-value" id="saved-count">0</span>
                </div>
            </div>
        </div>

        <div class="wind-turbine" id="turbine-1">
            <div class="tower"></div>
            <div class="nacelle-group"><div class="nacelle"></div><div class="hub"><div class="blades-container" id="blades-1"><div class="blade"></div><div class="blade"></div><div class="blade"></div></div></div></div>
            <div class="turbine-hitbox" onpointerdown="toggleCurtail(1); event.stopPropagation();" onpointerup="resetTurbineClick(1);" onpointercancel="resetTurbineClick(1);" onpointerout="resetTurbineClick(1);"></div>
        </div>
        <div class="wind-turbine" id="turbine-2">
            <div class="tower"></div>
            <div class="nacelle-group"><div class="nacelle"></div><div class="hub"><div class="blades-container" id="blades-2"><div class="blade"></div><div class="blade"></div><div class="blade"></div></div></div></div>
            <div class="turbine-hitbox" onpointerdown="toggleCurtail(2); event.stopPropagation();" onpointerup="resetTurbineClick(2);" onpointercancel="resetTurbineClick(2);" onpointerout="resetTurbineClick(2);"></div>
        </div>

        <!-- Bouton Pause minimaliste tout en bas au milieu -->
        <div id="btn-pause" onclick="togglePause()"><div class="pause-bars"><div class="pause-bar"></div><div class="pause-bar"></div></div></div>
    </div>

    <!-- Modales -->
    <div id="start-screen" class="screen">
        <div class="menu-box">
            <h1>🦇 Bat&Watt</h1>
            <input type="text" id="player-name" class="input-name" placeholder="Ton pseudo (ex: ÉcoloPro)" maxlength="15" onfocus="if(this.value==='Anonyme')this.value='';">
            
            <button id="btn-install" class="btn-main hidden" onclick="installPWA()" style="background: linear-gradient(135deg, #f59e0b, #d97706); margin-top:15px; margin-bottom: 15px;">Installer l'application</button>
            <button class="btn-main hidden" id="btn-load" onclick="loadGame()">CONTINUER LA PARTIE</button>
            <button class="btn-main" onclick="startGame()">NOUVELLE PARTIE</button>
            <button class="btn-secondary" onclick="showLeaderboard()">🏆 Classement</button>
        </div>
    </div>

    <div id="leaderboard-screen" class="screen hidden">
        <div class="menu-box">
            <h1>🏆 Classement</h1>
            <table class="leaderboard-table"><tbody id="leaderboard-list"></tbody></table>
            <button class="btn-secondary" onclick="showStartScreen()">Retour au Menu</button>
        </div>
    </div>

    <div id="pause-screen" class="screen hidden">
        <div class="menu-box">
            <h1>PAUSE</h1>
            <button class="btn-main" onclick="togglePause()">Reprendre</button>
            <button class="btn-secondary" style="background: rgba(52, 211, 153, 0.2); border-color: #34d399;" onclick="saveCurrentGame()">Sauvegarder</button>
        </div>
    </div>

    <div id="gameover-screen" class="screen hidden">
        <div class="menu-box">
            <h1 style="color: #ef4444;">⚠️ ARRÊT D'URGENCE</h1>
            <p id="final-stats"></p>
            <button class="btn-main" onclick="startGame()">NOUVELLE SESSION</button>
            <button class="btn-secondary" onclick="quitToMenu()">Menu Principal</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // --- DESIGN SONORE FIGÉ (PARAMÈTRES FIXES) ---
        // =========================================================================
        const soundConfig = {
            brake: { type: 'sawtooth', duration: 0.1, freq: 280, volume: 0.02 },
            bat:   { type: 'sine',     duration: 0.05, freq: 840, volume: 0.05 },
            bird:  { type: 'triangle', duration: 0.15, freq: 800, volume: 0.05 },
            crash: { type: 'square',   duration: 0.05, freq: 20,  volume: 0.2 },
            alarm: { type: 'sine',     duration: 0.2,  freq: 880, volume: 0.2 },
            dayup: { type: 'triangle', duration: 0.3,  freq: 520, volume: 0.2 }
        };

        // =========================================================================
        // --- SYNTHÉTISEUR AUDIO WEB AUDIO API ---
        // =========================================================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBrakeSound() {
            if (!audioCtx || gameSettings && !gameSettings.sfx) return;
            let cfg = soundConfig.brake;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = cfg.type;
            osc.frequency.setValueAtTime(cfg.freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(cfg.freq * 0.3, audioCtx.currentTime + cfg.duration);

            gain.gain.setValueAtTime(cfg.volume, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + cfg.duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + cfg.duration);
        }

        function playAnimalSound(type, speciesClass) {
            if (!audioCtx || gameSettings && !gameSettings.sfx) return;
            let cfg = (type === 'bat') ? soundConfig.bat : soundConfig.bird;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = cfg.type;
            let startFreq = cfg.freq;

            if (type === 'bird' && speciesClass) {
                let mult = 1;
                if (speciesClass === 'sp-eagle') mult = 1.5;  
                else if (speciesClass === 'sp-pigeon') mult = 0.5625; 
                else if (speciesClass === 'sp-crow') mult = 0.375;    
                else if (speciesClass === 'sp-parrot') mult = 1.875; 
                startFreq *= mult;
            }

            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(startFreq * 1.5, audioCtx.currentTime + cfg.duration);

            gain.gain.setValueAtTime(cfg.volume, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + cfg.duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + cfg.duration);
        }

        function playCrashSound() {
            if (!audioCtx || gameSettings && !gameSettings.sfx) return;
            let cfg = soundConfig.crash;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = cfg.type;
            osc.frequency.setValueAtTime(cfg.freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(cfg.freq * 0.5, audioCtx.currentTime + cfg.duration);

            gain.gain.setValueAtTime(cfg.volume, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + cfg.duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + cfg.duration);
        }

        function playAlarmSound() {
            if (!audioCtx || gameSettings && !gameSettings.sfx) return;
            let cfg = soundConfig.alarm;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = cfg.type;
            osc.frequency.setValueAtTime(cfg.freq, audioCtx.currentTime);
            osc.frequency.setValueAtTime(cfg.freq / 2, audioCtx.currentTime + (cfg.duration / 2));

            gain.gain.setValueAtTime(cfg.volume, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + cfg.duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + cfg.duration);
        }

        function playDayUpSound() {
            if (!audioCtx || gameSettings && !gameSettings.sfx) return;
            let cfg = soundConfig.dayup;
            let notes = [cfg.freq, cfg.freq * 1.26, cfg.freq * 1.5, cfg.freq * 2];

            notes.forEach((freq, i) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                osc.type = cfg.type;
                let startTime = audioCtx.currentTime + (i * 0.1);

                osc.frequency.setValueAtTime(freq, startTime);

                gain.gain.setValueAtTime(cfg.volume, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + cfg.duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + cfg.duration);
            });
        }

        // =========================================================================
        // --- LOGIQUE ET MOTEUR DE JEU ---
        // =========================================================================
        let production = 100, biodiversityPercent = 100, levelTime = 60, currentLevel = 1, gameTime = 0;
        let isPlaying = false, isPaused = false;
        let gameInterval, creatureInterval, animFrameId;
        let curtailed = { 1: false, 2: false }; let tSpeed = { 1: 4, 2: 4.5 }; let targetSpeed = { 1: 4, 2: 4.5 }; 
        let isNight = false, savedFauna = 0, injuredFauna = 0, totalEnergyProduced = 0;
        let rot1 = 0, rot2 = 0, lastTimestamp = 0;

        let batWattLeaderboard = JSON.parse(localStorage.getItem('batWattLeaderboard')) || [];
        let gameSettings = { sfx: true, music: true, particles: true };

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('player-name').value = localStorage.getItem('batWattLastPlayer') || "";
            checkSavedGame();
        });

        function saveScores() {
            let pName = document.getElementById('player-name').value.trim() || "Anonyme";
            localStorage.setItem('batWattLastPlayer', pName);
            
            let currentAnimalScore = savedFauna - injuredFauna;
            batWattLeaderboard.push({ name: pName, animals: currentAnimalScore });
            batWattLeaderboard.sort((a, b) => b.animals - a.animals);
            batWattLeaderboard = batWattLeaderboard.slice(0, 5);
            localStorage.setItem('batWattLeaderboard', JSON.stringify(batWattLeaderboard));
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || isPaused) return;
            if (e.key === '1') toggleCurtail(1); if (e.key === '2') toggleCurtail(2);
            if (e.key === 'Escape') togglePause();
        });

        function showStartScreen() { 
            document.getElementById('leaderboard-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden'); 
            checkSavedGame(); 
        }

        function showLeaderboard() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('leaderboard-screen').classList.remove('hidden');
            let tbody = document.getElementById('leaderboard-list');
            tbody.innerHTML = `<tr><th>Joueur</th><th>Animaux sauvés</th></tr>`;
            if (batWattLeaderboard.length === 0) {
                tbody.innerHTML += `<tr><td colspan="2" style="text-align:center;">Aucun score pour le moment</td></tr>`;
            } else {
                batWattLeaderboard.forEach(score => {
                    tbody.innerHTML += `<tr><td>${score.name}</td><td>${score.animals}</td></tr>`;
                });
            }
        }

        function saveCurrentGame() {
            let state = { playerName: document.getElementById('player-name').value.trim(), production, biodiversityPercent, levelTime, currentLevel, gameTime, savedFauna, injuredFauna, totalEnergyProduced };
            localStorage.setItem('batWattSaveGame', JSON.stringify(state)); 
            quitToMenu(); 
        }
        
        function loadGame() { let save = JSON.parse(localStorage.getItem('batWattSaveGame')); if(save) { document.getElementById('player-name').value = save.playerName || "Anonyme"; startGame(save); } }
        function checkSavedGame() { document.getElementById('btn-load').classList.toggle('hidden', !localStorage.getItem('batWattSaveGame')); }
        function quitToMenu() { isPlaying = false; isPaused = false; cancelAnimationFrame(animFrameId); clearInterval(gameInterval); clearInterval(creatureInterval); document.querySelectorAll('.creature').forEach(c => c.remove()); document.getElementById('pause-screen').classList.add('hidden'); document.getElementById('gameover-screen').classList.add('hidden'); showStartScreen(); }

        function startGame(loadedData = null) {
            initAudio(); 
            document.getElementById('start-screen').classList.add('hidden'); document.getElementById('pause-screen').classList.add('hidden'); document.getElementById('gameover-screen').classList.add('hidden'); document.querySelectorAll('.creature').forEach(c => c.remove());
            localStorage.setItem('batWattLastPlayer', document.getElementById('player-name').value.trim() || "Anonyme");
            
            if (loadedData && loadedData.currentLevel) {
                production = loadedData.production; biodiversityPercent = loadedData.biodiversityPercent; levelTime = loadedData.levelTime; currentLevel = loadedData.currentLevel; gameTime = loadedData.gameTime; savedFauna = loadedData.savedFauna; injuredFauna = loadedData.injuredFauna; totalEnergyProduced = loadedData.totalEnergyProduced;
            } else {
                production = 100; biodiversityPercent = 100; levelTime = 60; currentLevel = 1; gameTime = 0; savedFauna = 0; injuredFauna = 0; totalEnergyProduced = 0; 
            }
            
            curtailed = { 1: false, 2: false }; tSpeed = { 1: 4, 2: 4.5 }; targetSpeed = { 1: 4, 2: 4.5 };
            document.getElementById('turbine-1').classList.remove('curtailed'); document.getElementById('turbine-2').classList.remove('curtailed');
            isPlaying = true; isPaused = false; updateUI();
            
            if (gameInterval) clearInterval(gameInterval); gameInterval = setInterval(gameLoop, 400);
            if (creatureInterval) clearInterval(creatureInterval); creatureInterval = setInterval(manageCreatureSpawns, 1500);
            if (animFrameId) cancelAnimationFrame(animFrameId); lastTimestamp = performance.now(); animFrameId = requestAnimationFrame(runVisualLoop);
        }

        function updateBiodiversity() {
            let totalAnimals = savedFauna + injuredFauna;
            biodiversityPercent = totalAnimals > 0 ? (savedFauna / totalAnimals) * 100 : 100;
        }

        function gameLoop() {
            if (!isPlaying || isPaused) return;
            let speedFactor1 = Math.max(0, (tSpeed[1] - 0.8) / (4 - 0.8)); let speedFactor2 = Math.max(0, (tSpeed[2] - 0.8) / (4.5 - 0.8));
            let turbinePower = (speedFactor1 * 1.75) + (speedFactor2 * 1.75); let addedPower = turbinePower - 1.2;

            if (addedPower > 0) {
                production += addedPower; let addedKwh = addedPower * 1.5; totalEnergyProduced += addedKwh;
            } else { production += addedPower; }

            production = Math.max(0, Math.min(100, production));
            
            if (production <= 25 || biodiversityPercent <= 25) {
                playAlarmSound();
            }

            levelTime -= 0.4;
            if (levelTime <= 0) { 
                currentLevel++; levelTime = 60; 
                let badge = document.getElementById('level-badge'); badge.classList.remove('level-up-anim'); void badge.offsetWidth; badge.classList.add('level-up-anim'); 
                playDayUpSound(); 
            }
            if (production <= 0) endGame("Batterie vide ! La ville subit un Blackout total.");
            updateUI();
        }

        function runVisualLoop(timestamp) {
            if (!isPlaying) return;
            if (!isPaused) {
                let dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1); gameTime += dt; let accelRate = 8.5 * dt; 
                for (let i of [1, 2]) { if (tSpeed[i] < targetSpeed[i]) tSpeed[i] = Math.min(targetSpeed[i], tSpeed[i] + accelRate); else if (tSpeed[i] > targetSpeed[i]) tSpeed[i] = Math.max(targetSpeed[i], tSpeed[i] - accelRate); }
                rot1 += tSpeed[1] * (dt * 60); rot2 += tSpeed[2] * (dt * 60);
                document.getElementById('blades-1').style.transform = `rotate(${rot1}deg)`; document.getElementById('blades-2').style.transform = `rotate(${rot2}deg)`;
                
                updateEphemerisPoetic();
            }
            lastTimestamp = timestamp; animFrameId = requestAnimationFrame(runVisualLoop);
        }

        function updateEphemerisPoetic() {
            let angle = ((gameTime % 60) / 60) * Math.PI * 2; let sunFactor = Math.sin(angle); let moonFactor = Math.sin(angle + Math.PI);
            isNight = sunFactor < 0; document.getElementById('stars-container').style.opacity = isNight ? 1 : 0;
            let topColor, botColor; let sf = Math.max(-0.4, Math.min(0.4, sunFactor)); let t = (sf + 0.4) / 0.8; t = t * t * (3 - 2 * t); 
            const interp = (c1, c2, f) => [Math.round(c1[0] + f * (c2[0] - c1[0])), Math.round(c1[1] + f * (c2[1] - c1[1])), Math.round(c1[2] + f * (c2[2] - c1[2]))];
            if (t > 0.5) { let tr = (t - 0.5) * 2; topColor = interp([255,130,110], [56,189,248], tr); botColor = interp([255,180,140], [186,230,253], tr); }
            else { let tr = t * 2; topColor = interp([2,6,23], [255,130,110], tr); botColor = interp([15,23,42], [255,180,140], tr); }
            document.getElementById('game-container').style.background = `linear-gradient(to bottom, rgb(${topColor}), rgb(${botColor}))`;
            document.getElementById('sun-body').style.transform = `translate(${50 + Math.cos(angle)*45}vw, ${65 - Math.sin(angle)*45}vh)`; document.getElementById('sun-body').style.opacity = Math.max(0, Math.min(1, (sunFactor + 0.3) * 2));
            document.getElementById('moon-body').style.transform = `translate(${50 + Math.cos(angle + Math.PI)*45}vw, ${65 - Math.sin(angle + Math.PI)*45}vh) rotate(${-(angle * 180 / Math.PI)}deg)`; document.getElementById('moon-body').style.opacity = Math.max(0, Math.min(1, (moonFactor + 0.3) * 2));
        }

        function togglePause() { if (!isPlaying) return; isPaused = !isPaused; document.getElementById('pause-screen').classList.toggle('hidden', !isPaused); if (!isPaused) lastTimestamp = performance.now(); }
        
        function toggleCurtail(id) { 
            if (!isPlaying || isPaused) return; 
            curtailed[id] = !curtailed[id]; 
            targetSpeed[id] = curtailed[id] ? 0.8 : (id === 1 ? 4 : 4.5); 
            document.getElementById(`turbine-${id}`).classList.toggle('curtailed', curtailed[id]); 
            document.getElementById(`turbine-${id}`).classList.add('active-click'); 
            
            playBrakeSound();
        }
        
        function resetTurbineClick(id) { document.getElementById(`turbine-${id}`).classList.remove('active-click'); }
        function showFeedback(text, x, y, isGood) { let el = document.createElement('div'); el.className = `feedback-text ${isGood ? 'feedback-good' : 'feedback-bad'}`; el.innerText = text; el.style.left = `${x}px`; el.style.top = `${y}px`; document.getElementById('game-container').appendChild(el); setTimeout(() => el.remove(), 1000); }

        function manageCreatureSpawns() {
            if (!isPlaying || isPaused) return;
            let freqModifier = Math.min(1.5, 1 + (currentLevel * 0.1));
            if (isNight) { let waveSize = Math.floor(Math.random() * (2 + currentLevel/2)) + 1; for (let i = 0; i < waveSize; i++) { setTimeout(() => { if (isNight && isPlaying && !isPaused) spawnCreature('bat'); }, i * 400 / freqModifier); }
            } else if (Math.random() < 0.7 * freqModifier) { spawnCreature('bird'); }
        }

        function spawnCreature(type) {
            const container = document.getElementById('game-container');
            let creature = document.createElement('div');
            
            let speciesClass = '';
            if (type === 'bird') {
                const species = ['sp-eagle', 'sp-pigeon', 'sp-crow', 'sp-parrot'];
                speciesClass = species[Math.floor(Math.random() * species.length)];
            }
            
            creature.className = `creature ${type} ${speciesClass}`;
            creature.innerHTML = `<div class="wing left"></div><div class="body"></div><div class="wing right"></div>`;

            let targetId = Math.random() < 0.5 ? 'turbine-1' : 'turbine-2';
            let tRect = document.getElementById(targetId).getBoundingClientRect();
            let startX = tRect.left + (tRect.width / 2) + (Math.random() * 80 - 40);
            let posY = -60; let timeOffset = Math.random() * 100;
            
            creature.style.left = startX + 'px'; creature.style.top = posY + 'px';
            container.appendChild(creature);

            let baseSpeed = (type === 'bat') ? 3.0 : 2.2; let fallSpeed = baseSpeed + (currentLevel * 0.3);

            let fallInterval = setInterval(() => {
                if (!isPlaying) { creature.remove(); clearInterval(fallInterval); return; }
                if (isPaused || creature.classList.contains('crashing')) return;

                posY += fallSpeed; let posX = startX + Math.sin(posY/40 + timeOffset) * 20; 
                creature.style.left = posX + 'px'; creature.style.top = posY + 'px';

                let hit1 = checkTurbinePixelCollision(posX, posY, document.getElementById('turbine-1'), rot1);
                let hit2 = checkTurbinePixelCollision(posX, posY, document.getElementById('turbine-2'), rot2);

                if (hit1 || hit2) {
                    let activeCurtail = (hit1 && tSpeed[1] < 1.2) || (hit2 && tSpeed[2] < 1.2);
                    if (activeCurtail) {
                        savedFauna++; updateBiodiversity(); showFeedback("💚", posX, posY, true);
                        playAnimalSound(type, speciesClass);
                        creature.remove(); clearInterval(fallInterval);
                    } else {
                        injuredFauna++; updateBiodiversity(); showFeedback("💔", posX, posY, false);
                        playCrashSound(); 
                        updateUI(); creature.classList.add('crashing'); setTimeout(() => creature.remove(), 800); clearInterval(fallInterval);
                    }
                } else if (posY > window.innerHeight - 100) {
                    savedFauna++; updateBiodiversity(); 
                    playAnimalSound(type, speciesClass);
                    creature.remove(); clearInterval(fallInterval);
                }
            }, 30);
        }

        function checkTurbinePixelCollision(px, py, turbineEl, rotationDeg) {
            let towerEl = turbineEl.querySelector('.tower');
            if (towerEl) { let tRect = towerEl.getBoundingClientRect(); if (px >= tRect.left - 6 && px <= tRect.right + 6 && py >= tRect.top && py <= tRect.bottom) return true; }
            let bladesEl = turbineEl.querySelector('.blades-container');
            if (bladesEl) {
                let bRect = bladesEl.getBoundingClientRect(); let hubX = bRect.left; let hubY = bRect.top; let bladeLength = turbineEl.id === 'turbine-1' ? 75 : 90;
                let radBase = (rotationDeg - 90) * (Math.PI / 180);
                for (let b = 0; b < 3; b++) {
                    let angle = radBase + (b * 120 * Math.PI / 180);
                    let tipX = hubX + bladeLength * Math.cos(angle); let tipY = hubY + bladeLength * Math.sin(angle);
                    if (pointToSegmentDistance(px, py, hubX, hubY, tipX, tipY) < 18) return true;
                }
            } return false;
        }

        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            let A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1; let dot = A * C + B * D, len_sq = C * C + D * D, param = -1;
            if (len_sq != 0) param = dot / len_sq; let xx = (param < 0) ? x1 : (param > 1) ? x2 : x1 + param * C; let yy = (param < 0) ? y1 : (param > 1) ? y2 : y1 + param * D;
            let dx = px - xx, dy = py - yy; return Math.sqrt(dx * dx + dy * dy);
        }

        function updateUI() {
            document.getElementById('battery-fill').style.width = Math.round(production) + '%';
            document.getElementById('bio-fill').style.width = Math.round(biodiversityPercent) + '%';
            document.getElementById('level-num').innerText = currentLevel;
            
            let animalScore = savedFauna - injuredFauna;
            let savedCountEl = document.getElementById('saved-count');
            let bioHeartSvg = document.getElementById('bio-heart-svg');
            savedCountEl.innerText = animalScore;
            
            if (animalScore < 0) {
                savedCountEl.classList.add('text-danger');
                bioHeartSvg.style.fill = '#ef4444';
                bioHeartSvg.style.filter = 'drop-shadow(0 0 8px rgba(239, 68, 68, 0.9))';
            } else {
                savedCountEl.classList.remove('text-danger');
                bioHeartSvg.style.fill = '#10b981';
                bioHeartSvg.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.5))';
            }
            
            let currentKwh = Math.max(0, Math.min(10, Math.round((production / 100) * 10)));
            let energyCountEl = document.getElementById('energy-count');
            energyCountEl.innerText = currentKwh;

            if (production <= 25 || currentKwh <= 2) {
                energyCountEl.style.color = '#ef4444';
            } else if (production < 50 || currentKwh <= 5) {
                energyCountEl.style.color = '#f59e0b';
            } else {
                energyCountEl.style.color = '#ffffff';
            }

            let batContainer = document.getElementById('battery-container');
            batContainer.classList.remove('danger-50', 'danger-25');
            if (production <= 25) batContainer.classList.add('danger-25'); else if (production < 50) batContainer.classList.add('danger-50');

            let bioContainer = document.getElementById('bio-container');
            bioContainer.classList.remove('danger-50', 'danger-25');
            if (biodiversityPercent <= 25) bioContainer.classList.add('danger-25'); else if (biodiversityPercent < 50) bioContainer.classList.add('danger-50');
        }

        function endGame(reason) {
            isPlaying = false; cancelAnimationFrame(animFrameId); clearInterval(gameInterval); clearInterval(creatureInterval);
            saveScores(); localStorage.removeItem('batWattSaveGame'); document.querySelectorAll('.creature').forEach(b => b.remove());
            document.getElementById('final-stats').innerHTML = `Jour atteint : <b>${currentLevel}</b><br>` + `Faune sauvée : <b>${savedFauna}</b> | Blessée : <b>${injuredFauna}</b><br>` + `Énergie totale envoyée : <b>${Math.round(totalEnergyProduced)} kWh</b><br><br>` + `<span style="color:#ef4444">${reason}</span>`;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // =========================================================================
        // --- ENREGISTREMENT DU SERVICE WORKER & GESTION PWA ---
        // =========================================================================
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            let installBtn = document.getElementById('btn-install');
            if(installBtn) installBtn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('btn-install').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(error => {
                        console.error('[PWA] Échec de l\'enregistrement du Service Worker :', error);
                    });
            });
        }
    </script>
