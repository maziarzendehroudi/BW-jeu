    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            color: #ffffff;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ff758c, #ff7eb3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- ASTRES CÉLESTES (SOLEIL & LUNE) --- */
        .celestial {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            z-index: 1;
            will-change: transform, opacity;
        }

        .sun {
            background: #fde047;
            box-shadow: 0 0 50px #facc15;
        }

        .moon {
            background: #f1f5f9;
            box-shadow: 0 0 35px rgba(226, 232, 240, 0.5);
            overflow: hidden;
        }

        /* --- DÉCOR COLLINES & MONTAGNES (PLUS PLATES) --- */
        .mountain-bg-left {
            position: absolute;
            bottom: 150px;
            left: -10%;
            width: 60%;
            height: 130px;
            background: #dce7d1;
            border-radius: 50% 50% 0 0 / 20% 20% 0 0;
            z-index: 2;
        }

        .mountain-bg-right {
            position: absolute;
            bottom: 140px;
            right: -10%;
            width: 65%;
            height: 140px;
            background: #cfdec1;
            border-radius: 50% 50% 0 0 / 20% 20% 0 0;
            z-index: 2;
        }

        .hill-mid {
            position: absolute;
            bottom: 110px;
            left: 0;
            width: 100%;
            height: 160px;
            background: #b5cca2;
            clip-path: ellipse(70% 100% at 50% 100%);
            z-index: 3;
        }

        .hill-foreground {
            position: absolute;
            bottom: 80px;
            left: -10%;
            width: 120%;
            height: 120px;
            background: #8fb375;
            border-radius: 50% 50% 0 0 / 70% 70% 0 0;
            z-index: 4;
        }

        /* --- TOP HUD PLEINE LARGEUR --- */
        .top-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-left: none;
            border-right: none;
            border-radius: 0;
            padding: 8px 12px;
            z-index: 40;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .hud-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .level-badge {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
            transition: transform 0.3s;
        }

        .level-up-anim {
            animation: levelUpPop 0.8s ease-out;
        }

        @keyframes levelUpPop {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.35); filter: brightness(1.8); box-shadow: 0 0 20px #60a5fa; }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* --- BARRES VERTICALES MODERNES --- */
        .vertical-bar-container {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 260px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            z-index: 35;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .bar-title-v {
            font-size: 8px;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            letter-spacing: 1px;
        }

        .bar-value-v {
            font-size: 9px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 6px;
        }

        #battery-left {
            left: 12px;
        }

        .modern-track {
            width: 14px;
            height: 170px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .modern-fill {
            width: 100%;
            border-radius: 7px;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
        }

        .modern-fill.power-fill {
            background: linear-gradient(to top, #ef4444, #f59e0b, #10b981);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        .modern-fill.power-drain {
            background: linear-gradient(to top, #dc2626, #ef4444) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8) !important;
        }

        #biodiversity-right {
            right: 12px;
        }

        .modern-fill.bio-fill {
            background: linear-gradient(to top, #f59e0b, #10b981);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
        }

        /* --- ÉOLIENNES --- */
        .wind-turbine {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
        }

        #turbine-1 { left: 28%; bottom: 95px; }
        #turbine-1 .tower { height: 135px; width: 10px; clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%); }

        #turbine-2 { left: 68%; bottom: 115px; }
        #turbine-2 .tower { height: 165px; width: 12px; clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%); }

        .tower {
            background: linear-gradient(to right, #94a3b8, #f8fafc, #64748b);
            border-radius: 2px;
            box-shadow: -2px 0 8px rgba(0,0,0,0.25);
        }

        .nacelle {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, #f1f5f9, #cbd5e1);
            border-radius: 8px 12px 6px 6px;
            z-index: 11;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        #turbine-1 .nacelle { width: 22px; height: 12px; }
        #turbine-2 .nacelle { width: 26px; height: 14px; }

        .hub {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #475569;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 13;
        }

        /* Axe de rotation positionné exactement au centre géométrique du moyeu gris foncé */
        .blades-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-origin: 0 0;
            z-index: 12;
            will-change: transform;
        }

        .curtailed .nacelle {
            background: linear-gradient(to bottom, #fdba74, #ea580c);
        }

        .blade {
            position: absolute;
            background: linear-gradient(to bottom, #ffffff, #e2e8f0);
            border-radius: 50% 50% 4px 4px;
            transform-origin: top center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            clip-path: polygon(30% 0%, 70% 0%, 90% 100%, 10% 100%);
        }
        
        #turbine-1 .blade { height: 70px; width: 8px; top: 0px; left: -4px; }
        #turbine-1 .blade:nth-child(1) { transform: rotate(0deg); }
        #turbine-1 .blade:nth-child(2) { transform: rotate(120deg); }
        #turbine-1 .blade:nth-child(3) { transform: rotate(240deg); }

        #turbine-2 .blade { height: 85px; width: 9px; top: 0px; left: -4.5px; }
        #turbine-2 .blade:nth-child(1) { transform: rotate(0deg); }
        #turbine-2 .blade:nth-child(2) { transform: rotate(120deg); }
        #turbine-2 .blade:nth-child(3) { transform: rotate(240deg); }

        /* --- PUPITRE DE CONTRÔLE --- */
        .control-deck {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 110px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: #ffffff;
            border-top: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
            padding-left: 10px;
            padding-right: 10px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
        }

        .turbine-station {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 6px 8px;
            border-radius: 8px;
            width: 30%;
            max-width: 180px;
        }

        .station-title {
            font-size: 9px;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .btn-control {
            width: 100%;
            background: #e2e8f0;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 10px 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.1s;
        }

        .btn-control:active { transform: scale(0.95); }

        .btn-curtail { background: #ea580c; border-color: #c2410c; color: white; }
        .btn-curtail.active { background: #ea580c; box-shadow: 0 0 8px rgba(234, 88, 12, 0.4); }

        .ultrasound-station {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 34%;
            max-width: 200px;
        }

        .btn-ultrasound-global {
            position: relative;
            width: 100%;
            background: #0284c7;
            border: 1px solid #0369a1;
            color: white;
            padding: 12px 4px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }
        .btn-ultrasound-global:active { transform: scale(0.96); }

        /* --- ANIMAUX --- */
        .creature {
            position: absolute;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .creature-icon {
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .bat-icon { animation: flapWings 0.35s ease-in-out infinite alternate; }
        .bird-icon { animation: flapBird 0.4s ease-in-out infinite alternate; }

        @keyframes flapWings {
            0% { transform: scaleY(1) scaleX(1); }
            100% { transform: scaleY(0.7) scaleX(0.9) translateY(2px); }
        }

        @keyframes flapBird {
            0% { transform: translateY(0px) scaleX(1); }
            100% { transform: translateY(-4px) scaleX(1); }
        }

        .creature.fleeing {
            transition: transform 0.6s ease-out, top 0.6s ease-out;
            transform: translateX(-50%) translateY(-120px) scale(0.8);
            opacity: 0.3;
        }

        .creature.crashing {
            animation: crashFall 0.8s ease-in forwards;
        }

        @keyframes crashFall {
            0% { transform: translateX(-50%) rotate(0deg) scale(1); }
            50% { transform: translateX(-30%) rotate(180deg) scale(1.2); }
            100% { transform: translateX(20%) rotate(540deg) scale(0.6); opacity: 0; }
        }

        /* --- MODALES --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 30px;
        }

        .screen h1 {
            color: #0f172a;
            font-size: 26px;
            margin-bottom: 12px;
        }

        .screen p {
            color: #475569;
            max-width: 450px;
            line-height: 1.5;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .btn-main {
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
        }
        .btn-main:active { transform: scale(0.96); }

        .hidden { display: none !important; }
    </style>
</head>
