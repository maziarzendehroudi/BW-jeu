<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bat&Watt-v0.1 - Alignement Axe & Rotor Parfait</title>
    
    <!-- Paramètres PWA et Mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bat&Watt v0.1">
    <meta name="theme-color" content="#0f172a">

    <!-- Icônes & Favicons multi-navigateurs / PWA -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Manifest PWA externe -->
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
        }

        body {
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw; height: 100dvh;
            overflow: hidden;
            color: #ffffff;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #ff758c, #ff7eb3);
            overflow: hidden;
        }

        /* --- ÉTOILES --- */
        #stars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 0;
        }

        /* --- NUAGES --- */
        .cloud {
            position: absolute; background: rgba(255, 255, 255, 0.8);
            border-radius: 50px; z-index: 2; animation: floatCloud linear infinite;
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.1);
        }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: inherit; box-shadow: inherit; }
        .cloud::before { bottom: 40%; left: 15%; width: 50%; height: 100%; }
        .cloud::after { bottom: 20%; right: 10%; width: 40%; height: 80%; }
        @keyframes floatCloud { from { transform: translateX(110vw); } to { transform: translateX(-30vw); } }

        /* --- ASTRES --- */
        .celestial { position: absolute; width: 52px; height: 52px; z-index: 1; will-change: transform, opacity; }
        .sun { border-radius: 50%; background: #fde047; box-shadow: 0 0 60px #facc15; }
        .moon { background: transparent; box-shadow: none; overflow: visible; }

        /* --- BANDE DU BAS (Usine) --- */
        #bottom-band {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 85px;
            background: #020617; border-top: 2px solid #064e3b;
            z-index: 45;
        }

        /* --- DÉCOR (Remonté au-dessus de la bande) --- */
        .mountain-back { position: absolute; bottom: 125px; left: -5%; width: 110%; height: 260px; background: linear-gradient(to bottom, #475569, #1e293b); clip-path: polygon(0% 100%, 10% 40%, 25% 60%, 45% 15%, 65% 55%, 85% 25%, 100% 70%, 100% 100%); z-index: 3; }
        .mountain-mid { position: absolute; bottom: 105px; left: -5%; width: 110%; height: 200px; background: linear-gradient(to bottom, #334155, #0f172a); clip-path: polygon(0% 100%, 15% 50%, 35% 20%, 55% 70%, 75% 30%, 95% 60%, 100% 100%); z-index: 4; }
        .hill-mid { position: absolute; bottom: 85px; left: -5%; width: 110%; height: 140px; background: linear-gradient(to bottom, #0f766e, #042f2e); clip-path: polygon(0% 100%, 0% 30%, 20% 10%, 45% 35%, 70% 15%, 100% 40%, 100% 100%); z-index: 5; }
        .hill-foreground { position: absolute; bottom: 65px; left: -5%; width: 110%; height: 100px; background: linear-gradient(to bottom, #064e3b, #020617); clip-path: polygon(0% 100%, 0% 20%, 30% 40%, 60% 10%, 90% 30%, 100% 10%, 100% 100%); z-index: 6; }
        .mist-layer { position: absolute; bottom: 85px; left: -10%; width: 120%; height: 100px; background: linear-gradient(to top, rgba(45, 212, 191, 0.25), transparent); filter: blur(12px); z-index: 7; pointer-events: none; animation: mistBreathe 8s infinite alternate ease-in-out; }
        @keyframes mistBreathe { 0% { transform: translateY(0) scaleY(1); opacity: 0.4; } 100% { transform: translateY(-10px) scaleY(1.3); opacity: 0.8; } }

        /* --- HUD (Fusionné Haut & Côtés) --- */
        .top-hud {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 16px 20px; z-index: 40; pointer-events: none;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 15px;
        }
        .hud-side {
            background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 100%; max-width: 240px;
            transition: all 0.2s ease; pointer-events: auto;
        }
        #battery-container { justify-self: start; }
        #bio-container { justify-self: end; }

        .hud-stats {
            font-size: 24px; font-weight: 900; color: #ffffff;
            display: flex; align-items: center; justify-content: space-between;
        }
        .hud-icon { font-size: 20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .hud-value { display: flex; align-items: baseline; gap: 4px; }

        .modern-track { width: 100%; height: 14px; background: rgba(255, 255, 255, 0.1); border-radius: 7px; display: block; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
        .modern-fill { height: 100%; border-radius: 7px; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s; }
        .power-fill { background: linear-gradient(to right, #ef4444, #fef08a); box-shadow: 0 0 12px rgba(254, 240, 138, 0.5); }
        .bio-fill { background: linear-gradient(to right, #ef4444, #10b981); box-shadow: 0 0 12px rgba(16, 185, 129, 0.5); }

        .hud-center { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; justify-self: center;
            background: linear-gradient(135deg, #2563eb, #3b82f6); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5); border: none; 
            color: white; padding: 12px 30px; border-radius: 16px; pointer-events: auto;
        }
        .day-text { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; margin-bottom: -4px; }
        .day-num { font-size: 42px; font-weight: 900; line-height: 1; }
        .level-up-anim { animation: dayUpSpectacular 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes dayUpSpectacular { 
            0% { transform: scale(1); filter: brightness(1); } 
            30% { transform: scale(1.4) translateY(5px) rotate(-3deg); filter: brightness(1.5) drop-shadow(0 0 20px #facc15); color: #fef08a; } 
            50% { transform: scale(1.6) translateY(8px) rotate(3deg); filter: brightness(2) drop-shadow(0 0 30px #f59e0b); color: #ffffff; }
            70% { transform: scale(1.4) translateY(5px) rotate(-2deg); filter: brightness(1.5) drop-shadow(0 0 20px #facc15); color: #fef08a; } 
            100% { transform: scale(1); filter: brightness(1); } 
        }

        /* --- EFFETS SPECTACULAIRES --- */
        .danger-50 { animation: pulse-danger-50 0.8s ease-in-out infinite alternate !important; }
        .danger-25 { animation: pulse-danger-25 0.35s ease-in-out infinite alternate !important; }
        @keyframes pulse-danger-50 {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.4); }
            100% { transform: scale(1.08); box-shadow: 0 0 25px rgba(239, 68, 68, 1), inset 0 0 15px rgba(239, 68, 68, 0.8); border-color: rgba(239, 68, 68, 1); background: rgba(239, 68, 68, 0.3); }
        }
        @keyframes pulse-danger-25 {
            0% { transform: scale(1.08); box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); border-color: rgba(255, 0, 0, 0.6); }
            100% { transform: scale(1.15); box-shadow: 0 0 40px rgba(255, 0, 0, 1), inset 0 0 25px rgba(255, 0, 0, 0.9); border-color: #facc15; background: rgba(255, 0, 0, 0.6); }
        }

        /* --- ÉOLIENNES (Remontées) --- */
        .wind-turbine { position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: filter 0.3s; }
        #turbine-1 { left: 28%; bottom: 110px; } #turbine-1 .tower { height: 135px; width: 14px; clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%); }
        #turbine-2 { left: 68%; bottom: 130px; } #turbine-2 .tower { height: 165px; width: 16px; clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%); }
        .tower { background: linear-gradient(to right, #475569 0%, #ffffff 40%, #e2e8f0 70%, #334155 100%); border-radius: 2px; position: relative; }
        .tower::after { content: ''; position: absolute; bottom: 0; left: -25%; width: 150%; height: 6px; background: #1e293b; border-radius: 3px 3px 0 0; }
        .nacelle { position: absolute; top: -6px; background: linear-gradient(to bottom, #f1f5f9, #cbd5e1); border-radius: 8px 12px 6px 6px; z-index: 11; transition: background 0.3s; }
        .nacelle::after { content: ''; position: absolute; top: -3px; right: 6px; width: 4px; height: 4px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 6px #ef4444; animation: blinkAviation 2s infinite; }
        @keyframes blinkAviation { 0%, 15% { opacity: 1; } 20%, 100% { opacity: 0; } }
        #turbine-1 .nacelle { width: 22px; height: 12px; } #turbine-2 .nacelle { width: 26px; height: 14px; }
        .hub { position: absolute; width: 12px; height: 12px; background: #475569; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 13; }
        .blades-container { position: absolute; top: 50%; left: 50%; z-index: 12; will-change: transform; }
        .curtailed .nacelle { background: linear-gradient(to bottom, #fdba74, #ea580c); }
        .blade { position: absolute; background: linear-gradient(to bottom, #ffffff, #e2e8f0); border-radius: 50% 50% 4px 4px; transform-origin: top center; clip-path: polygon(30% 0%, 70% 0%, 90% 100%, 10% 100%); }
        #turbine-1 .blade { height: 70px; width: 8px; top: 0px; left: -4px; }
        #turbine-1 .blade:nth-child(1) { transform: rotate(0deg); } #turbine-1 .blade:nth-child(2) { transform: rotate(120deg); } #turbine-1 .blade:nth-child(3) { transform: rotate(240deg); }
        #turbine-2 .blade { height: 85px; width: 9px; top: 0px; left: -4.5px; }
        #turbine-2 .blade:nth-child(1) { transform: rotate(0deg); } #turbine-2 .blade:nth-child(2) { transform: rotate(120deg); } #turbine-2 .blade:nth-child(3) { transform: rotate(240deg); }

        /* --- PUPITRE DE CONTRÔLE (Boutons flottants sans fond) --- */
        .control-deck {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 20px; align-items: center; z-index: 50; padding: 0 20px;
        }
        .btn-control { 
            flex: 1; max-width: 180px; border: none; padding: 14px 4px; font-size: 13px; font-weight: 900; letter-spacing: 1px; border-radius: 6px; cursor: pointer; transition: all 0.2s; 
            background: linear-gradient(to bottom, #cbd5e1, #94a3b8); color: #0f172a; 
            box-shadow: 0 6px 0 #475569, 0 10px 15px rgba(0,0,0,0.5); border: 1px solid #e2e8f0; text-transform: uppercase;
        }
        .btn-control:active { transform: translateY(6px); box-shadow: 0 0 0 #475569, inset 0 4px 8px rgba(0,0,0,0.5); }
        .btn-curtail.active { 
            background: linear-gradient(to bottom, #f97316, #c2410c); color: white; 
            box-shadow: 0 6px 0 #7c2d12, 0 10px 15px rgba(0,0,0,0.5); border-color: #fdba74;
        }
        .btn-curtail.active:active { transform: translateY(6px); box-shadow: 0 0 0 #7c2d12, inset 0 4px 8px rgba(0,0,0,0.7); }
        .btn-ultrasound-global { 
            flex: 1; max-width: 180px; border: none; font-size: 13px; font-weight: 900; letter-spacing: 1px; border-radius: 6px; cursor: pointer; transition: all 0.2s; 
            background: linear-gradient(to bottom, #0ea5e9, #0369a1); color: white; 
            box-shadow: 0 6px 0 #0c4a6e, 0 10px 15px rgba(0,0,0,0.5); position: relative; overflow: hidden; padding: 14px 4px; border: 1px solid #7dd3fc;
        }
        .btn-ultrasound-global:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 #0c4a6e, inset 0 4px 8px rgba(0,0,0,0.6); }
        .btn-ultrasound-global:disabled { 
            filter: grayscale(1); cursor: not-allowed; opacity: 0.6; transform: none; 
            box-shadow: 0 6px 0 #334155; border-color: #475569;
        }
        #us-progress { position: absolute; top: 0; left: 0; height: 100%; width: 100%; background: repeating-linear-gradient(-45deg, rgba(0,0,0,0.4), rgba(0,0,0,0.4) 15px, rgba(0,0,0,0.1) 15px, rgba(0,0,0,0.1) 30px); transition: width 0.2s linear; }
        .btn-content { position: relative; z-index: 2; pointer-events: none; }

        /* --- OPTIMISATION MOBILE (Pixel 9a & Petits écrans) --- */
        @media (max-width: 768px) {
            .top-hud { gap: 8px; padding: 10px; }
            .hud-side { padding: 8px 12px; max-width: 140px; gap: 6px; border-radius: 12px; }
            .hud-stats { font-size: 18px; }
            .hud-stats .hud-icon { font-size: 14px; }
            .hud-stats .hud-value span:last-child { font-size: 10px !important; }
            .modern-track { height: 10px; }
            .hud-center { padding: 8px 20px; border-radius: 12px; }
            .day-text { font-size: 12px; }
            .day-num { font-size: 32px; }

            .control-deck { bottom: 20px; gap: 8px; padding: 0 10px; }
            .btn-control, .btn-ultrasound-global { font-size: 11px; padding: 12px 2px; box-shadow: 0 4px 0 #475569, 0 6px 10px rgba(0,0,0,0.3); }
            .btn-control:active { transform: translateY(4px); box-shadow: 0 0 0 #475569, inset 0 3px 6px rgba(0,0,0,0.5); }
            .btn-curtail.active { box-shadow: 0 4px 0 #7c2d12, 0 6px 10px rgba(0,0,0,0.3); }
            .btn-curtail.active:active { transform: translateY(4px); box-shadow: 0 0 0 #7c2d12, inset 0 3px 6px rgba(0,0,0,0.6); }
            .btn-ultrasound-global { box-shadow: 0 4px 0 #0c4a6e, 0 6px 10px rgba(0,0,0,0.3); }
            .btn-ultrasound-global:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 #0c4a6e, inset 0 3px 6px rgba(0,0,0,0.6); }
            .btn-ultrasound-global:disabled { box-shadow: 0 4px 0 #334155; }
            #turbine-1 { bottom: 115px; }
            #turbine-2 { bottom: 135px; }
        }

        /* --- ANIMAUX & FEEDBACKS --- */
        .creature { position: absolute; z-index: 30; font-size: 28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); will-change: transform; }
        .bat-icon { animation: flapWings 0.35s ease-in-out infinite alternate; }
        .bird-icon { animation: flapBird 0.4s ease-in-out infinite alternate; }
        @keyframes flapWings { 0% { transform: scaleY(1) scaleX(1); } 100% { transform: scaleY(0.7) scaleX(0.9) translateY(2px); } }
        @keyframes flapBird { 0% { transform: translateY(0px) scaleX(1); } 100% { transform: translateY(-4px) scaleX(1); } }
        .fleeing { transition: all 0.6s ease-out; transform: translateY(-120px) scale(0.8); opacity: 0.3; }
        .crashing { animation: crashFall 0.8s ease-in forwards; }
        @keyframes crashFall { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(540deg) scale(0.6); opacity: 0; } }
        .feedback-text { position: absolute; font-weight: bold; font-size: 14px; z-index: 60; animation: floatUp 1s ease-out forwards; pointer-events: none; }
        .feedback-good { color: #10b981; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .feedback-bad { color: #ef4444; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

        /* --- MODALES & MENUS --- */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
        .menu-box { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-width: 400px; width: 90%; }
        .menu-box h1 { font-size: 28px; margin-bottom: 10px; background: linear-gradient(to right, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-box p { font-size: 14px; line-height: 1.6; color: #cbd5e1; margin-bottom: 20px; }
        .stats-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .btn-main { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 6px 0 #047857; transition: all 0.1s; width: 100%; margin-bottom: 10px; }
        .btn-main:active { transform: translateY(6px); box-shadow: 0 0 0 #047857; }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container" ontouchstart="handleContainerTouch(event)" onclick="handleContainerClick(event)">
        <div id="stars-container"></div>
        <div class="cloud" style="top: 15%; width: 60px; height: 20px; animation-duration: 40s;"></div>
        <div class="cloud" style="top: 30%; width: 100px; height: 30px; animation-duration: 25s; opacity: 0.6;"></div>

        <div id="sun-body" class="celestial sun"></div>
        
        <div id="moon-body" class="celestial moon">
            <svg viewBox="0 0 52 52" width="100%" height="100%">
                <circle cx="26" cy="26" r="26" fill="#0f172a" opacity="0.4" />
                <path d="M26,0 A26,26 0 0,1 26,52 A14,26 0 0,0 26,0 Z" fill="#f1f5f9" />
            </svg>
        </div>

        <div id="bottom-band"></div>

        <div class="mountain-back"></div>
        <div class="mountain-mid"></div>
        <div class="hill-mid"></div>
        <div class="hill-foreground"></div>
        <div class="mist-layer"></div>

        <div class="top-hud">
            <!-- Bloc Énergie Gauche -->
            <div class="hud-side" id="battery-container">
                <div class="hud-stats">
                    <span class="hud-icon">⚡</span>
                    <span class="hud-value"><span id="energy-count">0</span> <span style="font-size: 14px; font-weight: 700; color: #94a3b8;">kWh</span></span>
                </div>
                <div class="modern-track"><div class="modern-fill power-fill" id="battery-fill" style="width: 0%;"></div></div>
            </div>

            <!-- Bloc Jour Centre -->
            <div class="hud-center" id="level-badge">
                <div class="day-text">Jour</div>
                <div class="day-num" id="level-num">1</div>
            </div>

            <!-- Bloc Biodiversité Droite -->
            <div class="hud-side" id="bio-container">
                <div class="hud-stats">
                    <span class="hud-icon">💚</span>
                    <span class="hud-value" id="saved-count">0</span>
                </div>
                <div class="modern-track"><div class="modern-fill bio-fill" id="bio-fill" style="width: 100%;"></div></div>
            </div>
        </div>

        <div class="wind-turbine" id="turbine-1">
            <div class="tower"></div>
            <div class="nacelle"><div class="hub"><div class="blades-container" id="blades-1">
                <div class="blade"></div><div class="blade"></div><div class="blade"></div>
            </div></div></div>
        </div>

        <div class="wind-turbine" id="turbine-2">
            <div class="tower"></div>
            <div class="nacelle"><div class="hub"><div class="blades-container" id="blades-2">
                <div class="blade"></div><div class="blade"></div><div class="blade"></div>
            </div></div></div>
        </div>

        <div class="control-deck" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();">
            <button class="btn-control btn-curtail" id="btn-c1" onclick="toggleCurtail(1)">BRIDER</button>
            <button class="btn-ultrasound-global" id="btn-ultrasound" onclick="triggerGlobalUltrasound()">
                <div id="us-progress" style="width: 0%;"></div>
                <span class="btn-content">🔊 ULTRASONS</span>
            </button>
            <button class="btn-control btn-curtail" id="btn-c2" onclick="toggleCurtail(2)">BRIDER</button>
        </div>
    </div>

    <!-- Modales -->
    <div id="start-screen" class="screen">
        <div class="menu-box">
            <h1>🦇 Bat&Watt</h1>
            <p>Régulez la production électrique de vos éoliennes tout en préservant la faune locale (Oiseaux de jour, Chauves-souris la nuit).</p>
            <div class="stats-box">
                <b>🏆 Meilleurs Scores :</b><br>
                Jour max : <span id="menu-high-level">1</span><br>
                Énergie max : <span id="menu-high-energy">0</span> kWh
            </div>
            <button class="btn-main" onclick="startGame()">LANCER LA CENTRALE</button>
        </div>
    </div>

    <div id="pause-screen" class="screen hidden">
        <div class="menu-box">
            <h1>PAUSE</h1>
            <button class="btn-main" onclick="togglePause()">Reprendre</button>
            <button class="btn-secondary" onclick="quitToMenu()">Quitter vers le Menu</button>
        </div>
    </div>

    <div id="gameover-screen" class="screen hidden">
        <div class="menu-box">
            <h1 style="color: #ef4444;">⚠️ ARRÊT D'URGENCE</h1>
            <p id="final-stats"></p>
            <button class="btn-main" onclick="startGame()">NOUVELLE SESSION</button>
            <button class="btn-secondary" onclick="quitToMenu()">Menu Principal</button>
        </div>
    </div>

    <script>
        let production = 0, biodiversityPercent = 100, levelTime = 60, currentLevel = 1, gameTime = 0;
        let isPlaying = false, isPaused = false;
        let gameInterval, creatureInterval, animFrameId;
        
        let curtailed = { 1: false, 2: false };
        let tSpeed = { 1: 4, 2: 4.5 }; // Vitesse instantanée (inertie)
        let targetSpeed = { 1: 4, 2: 4.5 }; // Vitesse cible demandée
        
        let isNight = false;
        let savedFauna = 0, injuredFauna = 0, totalEnergyProduced = 0;
        let ultrasoundCharge = 100; // Charge max (en kWh générés)
        let rot1 = 0, rot2 = 0, lastTimestamp = 0;

        let highScores = JSON.parse(localStorage.getItem('batWattScores')) || { maxLevel: 1, maxEnergy: 0 };
        document.getElementById('menu-high-level').innerText = highScores.maxLevel;
        document.getElementById('menu-high-energy').innerText = Math.round(highScores.maxEnergy);

        function saveScores() {
            if (currentLevel > highScores.maxLevel) highScores.maxLevel = currentLevel;
            if (totalEnergyProduced > highScores.maxEnergy) highScores.maxEnergy = totalEnergyProduced;
            localStorage.setItem('batWattScores', JSON.stringify(highScores));
            document.getElementById('menu-high-level').innerText = highScores.maxLevel;
            document.getElementById('menu-high-energy').innerText = Math.round(highScores.maxEnergy);
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || isPaused) return;
            if (e.key === '1') toggleCurtail(1);
            if (e.key === '2') toggleCurtail(2);
            if (e.key === ' ') { e.preventDefault(); triggerGlobalUltrasound(); }
            if (e.key === 'Escape') togglePause();
        });

        function handleContainerClick(e) { if (isPlaying) togglePause(); }
        function handleContainerTouch(e) { if (isPlaying) { e.preventDefault(); togglePause(); } }

        function quitToMenu() {
            isPlaying = false; isPaused = false;
            cancelAnimationFrame(animFrameId); clearInterval(gameInterval); clearInterval(creatureInterval);
            document.querySelectorAll('.creature').forEach(c => c.remove());
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.querySelectorAll('.creature').forEach(c => c.remove());
            
            production = 20; 
            biodiversityPercent = 100; levelTime = 60; currentLevel = 1; gameTime = 0;
            savedFauna = 0; injuredFauna = 0; totalEnergyProduced = 0;
            ultrasoundCharge = 100; 
            document.getElementById('us-progress').style.width = '100%';
            document.getElementById('btn-ultrasound').disabled = false;

            curtailed = { 1: false, 2: false };
            tSpeed = { 1: 4, 2: 4.5 };
            targetSpeed = { 1: 4, 2: 4.5 };

            document.getElementById('btn-c1').classList.remove('active'); document.getElementById('btn-c2').classList.remove('active');
            document.getElementById('btn-c1').innerText = "BRIDER"; document.getElementById('btn-c2').innerText = "BRIDER";
            document.getElementById('turbine-1').classList.remove('curtailed'); document.getElementById('turbine-2').classList.remove('curtailed');

            isPlaying = true; isPaused = false;
            updateUI();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 400);

            if (creatureInterval) clearInterval(creatureInterval);
            creatureInterval = setInterval(manageCreatureSpawns, 1500);

            if (animFrameId) cancelAnimationFrame(animFrameId);
            lastTimestamp = performance.now();
            animFrameId = requestAnimationFrame(runVisualLoop);
        }

        function updateBiodiversity() {
            let totalAnimals = savedFauna + injuredFauna;
            if (totalAnimals > 0) {
                biodiversityPercent = (savedFauna / totalAnimals) * 100;
            } else {
                biodiversityPercent = 100;
            }
        }

        function gameLoop() {
            if (!isPlaying || isPaused) return;

            // --- INERTIE DE L'ÉNERGIE (Basée sur la vitesse réelle des pales) ---
            // tSpeed varie entre 0.8 (bridé) et 4 ou 4.5 (libre).
            let speedFactor1 = Math.max(0, (tSpeed[1] - 0.8) / (4 - 0.8));
            let speedFactor2 = Math.max(0, (tSpeed[2] - 0.8) / (4.5 - 0.8));
            
            // Chaque éolienne peut fournir jusqu'à 1.75 (Total max = 3.5)
            let turbinePower = (speedFactor1 * 1.75) + (speedFactor2 * 1.75);
            // La ville consomme de l'énergie en continu (-1.2)
            let addedPower = turbinePower - 1.2;

            if (addedPower > 0) {
                production += addedPower;
                let addedKwh = addedPower * 1.5;
                totalEnergyProduced += addedKwh;
                
                // Rechargement progressif des ultrasons
                if (ultrasoundCharge < 100) {
                    ultrasoundCharge += addedKwh;
                    if (ultrasoundCharge >= 100) {
                        ultrasoundCharge = 100;
                        document.getElementById('btn-ultrasound').disabled = false;
                    }
                    document.getElementById('us-progress').style.width = ultrasoundCharge + '%';
                }
            } else {
                // Perte sèche
                production += addedPower;
            }

            production = Math.max(0, Math.min(100, production));

            levelTime -= 0.4;
            if (levelTime <= 0) {
                currentLevel++; levelTime = 60;
                let badge = document.getElementById('level-badge');
                badge.classList.remove('level-up-anim'); void badge.offsetWidth; badge.classList.add('level-up-anim');
            }

            // Conditions de défaite
            if (production <= 0) endGame("Batterie vide ! La ville subit un Blackout total.");

            updateUI();
        }

        function runVisualLoop(timestamp) {
            if (!isPlaying) return;
            if (!isPaused) {
                let dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
                gameTime += dt;
                
                // INERTIE MÉCANIQUE : 1.5 secondes pour atteindre la vitesse cible
                let accelRate = 2.46 * dt; 
                
                for (let i of [1, 2]) {
                    if (tSpeed[i] < targetSpeed[i]) {
                        tSpeed[i] = Math.min(targetSpeed[i], tSpeed[i] + accelRate);
                    } else if (tSpeed[i] > targetSpeed[i]) {
                        tSpeed[i] = Math.max(targetSpeed[i], tSpeed[i] - accelRate);
                    }
                }

                rot1 += tSpeed[1] * (dt * 60);
                rot2 += tSpeed[2] * (dt * 60);
                
                document.getElementById('blades-1').style.transform = `rotate(${rot1}deg)`;
                document.getElementById('blades-2').style.transform = `rotate(${rot2}deg)`;
                
                updateEphemerisPoetic();
            }
            lastTimestamp = timestamp;
            animFrameId = requestAnimationFrame(runVisualLoop);
        }

        function interpolateColor(c1, c2, factor) {
            factor = Math.max(0, Math.min(1, factor));
            return [Math.round(c1[0] + factor * (c2[0] - c1[0])), Math.round(c1[1] + factor * (c2[1] - c1[1])), Math.round(c1[2] + factor * (c2[2] - c1[2]))];
        }

        function updateEphemerisPoetic() {
            let cycleProgress = (gameTime % 60) / 60;
            let angle = cycleProgress * Math.PI * 2;
            let sunFactor = Math.sin(angle);
            let moonFactor = Math.sin(angle + Math.PI);
            isNight = sunFactor < 0;

            document.getElementById('stars-container').style.opacity = isNight ? 1 : 0;

            let topColor, botColor;
            let sf = Math.max(-0.4, Math.min(0.4, sunFactor)); 
            let t = (sf + 0.4) / 0.8; 
            t = t * t * (3 - 2 * t); 

            if (t > 0.5) { 
                let tr = (t - 0.5) * 2; 
                topColor = interpolateColor([255,130,110], [56,189,248], tr);
                botColor = interpolateColor([255,180,140], [186,230,253], tr);
            } else {
                let tr = t * 2; 
                topColor = interpolateColor([2,6,23], [255,130,110], tr);
                botColor = interpolateColor([15,23,42], [255,180,140], tr);
            }

            document.getElementById('game-container').style.background = `linear-gradient(to bottom, rgb(${topColor}), rgb(${botColor}))`;
            
            let sunEl = document.getElementById('sun-body');
            sunEl.style.transform = `translate(${50 + Math.cos(angle)*46}vw, ${55 - Math.sin(angle)*55}vh)`;
            sunEl.style.opacity = Math.max(0, Math.min(1, (sunFactor + 0.3) * 2));

            let moonEl = document.getElementById('moon-body');
            let moonRotation = -(angle * 180 / Math.PI);
            moonEl.style.transform = `translate(${50 + Math.cos(angle + Math.PI)*46}vw, ${55 - Math.sin(angle + Math.PI)*55}vh) rotate(${moonRotation}deg)`;
            moonEl.style.opacity = Math.max(0, Math.min(1, (moonFactor + 0.3) * 2));
        }

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            document.getElementById('pause-screen').classList.toggle('hidden', !isPaused);
            if (!isPaused) lastTimestamp = performance.now();
        }

        function toggleCurtail(id) {
            if (!isPlaying || isPaused) return;
            curtailed[id] = !curtailed[id];
            
            // Vitesse cible (l'inertie fait la transition)
            targetSpeed[id] = curtailed[id] ? 0.8 : (id === 1 ? 4 : 4.5);
            
            const btn = document.getElementById(`btn-c${id}`);
            const turbine = document.getElementById(`turbine-${id}`);
            btn.classList.toggle('active', curtailed[id]);
            btn.innerText = curtailed[id] ? "LIBÉRER" : "BRIDER";
            turbine.classList.toggle('curtailed', curtailed[id]);
        }

        function showFeedback(text, x, y, isGood) {
            let el = document.createElement('div');
            el.className = `feedback-text ${isGood ? 'feedback-good' : 'feedback-bad'}`;
            el.innerText = text;
            el.style.left = `${x}px`; el.style.top = `${y}px`;
            document.getElementById('game-container').appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function triggerGlobalUltrasound() {
            if (!isPlaying || isPaused || production < 30 || ultrasoundCharge < 100) return;
            
            production -= 30;
            ultrasoundCharge = 0;
            
            document.getElementById('us-progress').style.width = '0%';
            document.getElementById('btn-ultrasound').disabled = true;

            let fillEl = document.getElementById('battery-fill');
            fillEl.classList.add('power-drain'); setTimeout(() => fillEl.classList.remove('power-drain'), 400);

            [1, 2].forEach(id => {
                let turbine = document.getElementById(`turbine-${id}`);
                turbine.style.filter = "drop-shadow(0 0 20px #0284c7)";
                setTimeout(() => turbine.style.filter = "none", 400);
            });

            document.querySelectorAll('.creature').forEach(creature => {
                if (creature.classList.contains('crashing') || creature.classList.contains('fleeing')) return;
                creature.classList.add('fleeing');
                savedFauna++;
                updateBiodiversity();
                
                let rect = creature.getBoundingClientRect();
                showFeedback("💚", rect.left, rect.top, true);
                setTimeout(() => creature.remove(), 600);
            });
            updateUI();
        }

        function manageCreatureSpawns() {
            if (!isPlaying || isPaused) return;
            let freqModifier = Math.min(1.5, 1 + (currentLevel * 0.1));
            
            if (isNight) {
                let waveSize = Math.floor(Math.random() * (2 + currentLevel/2)) + 1;
                for (let i = 0; i < waveSize; i++) {
                    setTimeout(() => { if (isNight && isPlaying && !isPaused) spawnCreature('bat'); }, i * 400 / freqModifier);
                }
            } else if (Math.random() < 0.7 * freqModifier) {
                spawnCreature('bird');
            }
        }

        function spawnCreature(type) {
            const container = document.getElementById('game-container');
            let creature = document.createElement('div');
            creature.className = `creature ${type}-icon`;
            creature.innerText = type === 'bat' ? '🦇' : '🦅';
            
            let startX = Math.random() * (window.innerWidth - 120) + 60;
            let posY = -40; let timeOffset = Math.random() * 100;
            
            creature.style.left = startX + 'px'; creature.style.top = posY + 'px';
            container.appendChild(creature);

            let baseSpeed = (type === 'bat') ? 3.0 : 2.2;
            let fallSpeed = baseSpeed + (currentLevel * 0.3);

            let fallInterval = setInterval(() => {
                if (!isPlaying) { creature.remove(); clearInterval(fallInterval); return; }
                if (isPaused || creature.classList.contains('crashing') || creature.classList.contains('fleeing')) return;

                posY += fallSpeed;
                let posX = startX + Math.sin(posY/40 + timeOffset) * 30;
                
                creature.style.left = posX + 'px';
                creature.style.top = posY + 'px';

                let hit1 = checkTurbinePixelCollision(posX, posY, document.getElementById('turbine-1'), rot1);
                let hit2 = checkTurbinePixelCollision(posX, posY, document.getElementById('turbine-2'), rot2);

                if (hit1 || hit2) {
                    let activeCurtail = (hit1 && tSpeed[1] < 1.2) || (hit2 && tSpeed[2] < 1.2);

                    if (activeCurtail) {
                        savedFauna++;
                        updateBiodiversity();
                        showFeedback("💚", posX, posY, true);
                        creature.remove(); clearInterval(fallInterval);
                    } else {
                        injuredFauna++;
                        updateBiodiversity();
                        showFeedback("💔", posX, posY, false);
                        updateUI();
                        creature.classList.add('crashing');
                        setTimeout(() => creature.remove(), 800);
                        clearInterval(fallInterval);
                    }
                } else if (posY > window.innerHeight - 100) {
                    savedFauna++;
                    updateBiodiversity();
                    creature.remove(); clearInterval(fallInterval);
                }
            }, 30);
        }

        function checkTurbinePixelCollision(px, py, turbineEl, rotationDeg) {
            let towerEl = turbineEl.querySelector('.tower');
            if (towerEl) {
                let tRect = towerEl.getBoundingClientRect();
                if (px >= tRect.left - 4 && px <= tRect.right + 4 && py >= tRect.top && py <= tRect.bottom) return true;
            }
            let bladesEl = turbineEl.querySelector('.blades-container');
            if (bladesEl) {
                let bRect = bladesEl.getBoundingClientRect();
                let hubX = bRect.left, hubY = bRect.top;
                let bladeLength = turbineEl.id === 'turbine-1' ? 70 : 85;
                let radBase = rotationDeg * (Math.PI / 180);
                for (let b = 0; b < 3; b++) {
                    let angle = radBase + (b * 120 * Math.PI / 180);
                    let tipX = hubX + bladeLength * Math.cos(angle - Math.PI / 2);
                    let tipY = hubY + bladeLength * Math.sin(angle - Math.PI / 2);
                    if (pointToSegmentDistance(px, py, hubX, hubY, tipX, tipY) < 15) return true;
                }
            }
            return false;
        }

        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            let A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
            let dot = A * C + B * D, len_sq = C * C + D * D, param = -1;
            if (len_sq != 0) param = dot / len_sq;
            let xx = (param < 0) ? x1 : (param > 1) ? x2 : x1 + param * C;
            let yy = (param < 0) ? y1 : (param > 1) ? y2 : y1 + param * D;
            let dx = px - xx, dy = py - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function updateUI() {
            document.getElementById('battery-fill').style.width = Math.round(production) + '%';
            document.getElementById('bio-fill').style.width = Math.round(biodiversityPercent) + '%';
            document.getElementById('level-num').innerText = currentLevel;
            document.getElementById('saved-count').innerText = savedFauna;
            document.getElementById('energy-count').innerText = Math.round(totalEnergyProduced);

            // Gestions des effets de danger (clignotement et gonflement sur les conteneurs du HUD)
            let batContainer = document.getElementById('battery-container');
            batContainer.classList.remove('danger-50', 'danger-25');
            if (production <= 25) {
                batContainer.classList.add('danger-25');
            } else if (production < 50) {
                batContainer.classList.add('danger-50');
            }

            let bioContainer = document.getElementById('bio-container');
            bioContainer.classList.remove('danger-50', 'danger-25');
            if (biodiversityPercent <= 25) {
                bioContainer.classList.add('danger-25');
            } else if (biodiversityPercent < 50) {
                bioContainer.classList.add('danger-50');
            }
        }

        function endGame(reason) {
            isPlaying = false;
            cancelAnimationFrame(animFrameId); clearInterval(gameInterval); clearInterval(creatureInterval);
            saveScores();
            
            document.querySelectorAll('.creature').forEach(b => b.remove());
            document.getElementById('final-stats').innerHTML = 
                `Jour atteint : <b>${currentLevel}</b><br>` +
                `Faune sauvée : <b>${savedFauna}</b> | Blessée : <b>${injuredFauna}</b><br>` +
                `Énergie totale envoyée : <b>${Math.round(totalEnergyProduced)} kWh</b><br><br>` +
                `<span style="color:#ef4444">${reason}</span>`;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    console.log('Service worker enregistré.', reg);
                });
            });
        }
    </script>
</body>
